name: Deploy Cog Model to Replicate

on:
  # 手動觸發（Go to Actions tab → Run workflow）
  workflow_dispatch:
  # 或當 replicate/ 目錄有變動時自動觸發
  push:
    paths:
      - "replicate/**"
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cog CLI
        run: |
          sudo curl -o /usr/local/bin/cog -L \
            "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Log in to Replicate container registry
        run: |
          echo "${{ secrets.VITE_REPLICATE_API_TOKEN }}" | docker login r8.im \
            --username explooosion \
            --password-stdin

      - name: Push model to Replicate
        working-directory: replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.VITE_REPLICATE_API_TOKEN }}
        run: |
          cog push r8.im/explooosion/rtttl-hub 2>&1 | tee /tmp/cog_push.log
          # Extract the new version ID from the push output
          VERSION=$(grep -oP '(?<=replicate.com/explooosion/rtttl-hub:)\w+' /tmp/cog_push.log | tail -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version ID from cog push output"
            cat /tmp/cog_push.log
            exit 1
          fi
          echo "NEW_MODEL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Pushed version: $VERSION"

      - name: Update deployment to new version
        env:
          REPLICATE_API_TOKEN: ${{ secrets.VITE_REPLICATE_API_TOKEN }}
        run: |
          echo "Updating deployment explooosion/rtttl-hub-ai to version $NEW_MODEL_VERSION"
          HTTP_STATUS=$(curl -s -o /tmp/deploy_resp.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"$NEW_MODEL_VERSION\"}" \
            "https://api.replicate.com/v1/deployments/explooosion/rtttl-hub-ai")
          cat /tmp/deploy_resp.json
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Deployment update failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment updated successfully to version $NEW_MODEL_VERSION"
