name: Deploy Cog Model to Replicate

on:
  # 手動觸發（Go to Actions tab → Run workflow）
  workflow_dispatch:
  # 或當 replicate/ 目錄有變動時自動觸發
  push:
    paths:
      - "replicate/**"
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cog CLI
        run: |
          sudo curl -o /usr/local/bin/cog -L \
            "https://github.com/replicate/cog/releases/latest/download/cog_$(uname -s)_$(uname -m)"
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: Log in to Replicate container registry
        run: |
          echo "${{ secrets.VITE_REPLICATE_API_TOKEN }}" | docker login r8.im \
            --username explooosion \
            --password-stdin

      - name: Push model to Replicate
        working-directory: replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.VITE_REPLICATE_API_TOKEN }}
        run: cog push r8.im/explooosion/rtttl-hub
