# Configuration for https://github.com/replicate/cog
build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  python_packages:
    - "torch==2.1.2"
    - "torchaudio==2.1.2"
    - "demucs==4.0.1"
    - "basic-pitch==0.3.3"
    - "numpy<2"
    - "pydub==0.25.1"
    - "pretty_midi==0.2.10"
  system_packages:
    - "ffmpeg"

predict: "predict.py:Predictor"
